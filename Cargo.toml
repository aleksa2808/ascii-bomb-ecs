[package]
name = "ascii-bomb-ecs"
version = "0.1.0"
edition = "2021"

[lib]
name = "ascii_bomb_ecs_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
cfg-if = "1.0"
rodio = { version = "0.14", default-features = false, features = [
    "wav",
    "vorbis",
] }
anyhow = "1.0"
itertools = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "dynamic_linking",
    "bevy_winit",
    "png",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "x11",
    "bevy_asset",
    "multi_threaded",
    "bevy_state",
] }
kira = "0.5.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: fix canvas resizing
# With the current design, both a logical window size (game pixel count per axis) and a physical
# window size (browser pixel count per axis) are needed. The working design was to set the logical
# size via bevy which then changes the canvas width/height properties via winit. The `index.js`
# script then reacts to it by scaling the canvas to the browser window(via style width/height
# attributes).
# However, since the 0.13 bevy version bevy started reacting to the style attribute changes,
# modifying its logical window size based on them which breaks canvas scaling. One option around
# this would be to use a patched version of bevy which doesn't react to canvas changes as in this
# project the game should always be in charge of both the logical and the physical window sizes.
bevy = { version = "0.16", default-features = false, features = [
    "bevy_winit",
    "png",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_asset",
    "webgl2",
    "bevy_state",
] }
once_cell = "1.8.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioParam",
    "GainNode",
] }
# needed in order for getrandom 0.3.3 to work on wasm32
getrandom = { version = "0.3", features = ["wasm_js"] }
# needed in order for uuid 1.17 to work on wasm32
uuid = { version = "1.17", features = ["rng-getrandom"] }
